<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Warm Amber Gold Gradient matching official Raven emblem -->
    <linearGradient id="amberGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbb03b" />
      <stop offset="50%" stop-color="#f7941d" />
      <stop offset="100%" stop-color="#d36f0a" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (Charcoal / Near-Black) -->
  <rect width="500" height="500" rx="100" fill="#121318" />

  <!-- Top-Left Concentric Warm Amber Sunburst Arcs -->
  <path d="M 90 260 A 170 170 0 0 1 355 95" fill="none" stroke="url(#amberGoldGrad)" stroke-width="26" stroke-linecap="round" />
  <path d="M 128 260 A 132 132 0 0 1 332 132" fill="none" stroke="url(#amberGoldGrad)" stroke-width="22" stroke-linecap="round" />
  <path d="M 164 260 A 96 96 0 0 1 310 166" fill="none" stroke="url(#amberGoldGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- White Raven Silhouette (Head, Beak, Body, and Sweeping Wings) -->
  <!-- Beak and Head Facing Right -->
  <path d="M 315 110 C 270 120, 230 160, 220 180 C 280 160, 310 185, 335 220 C 375 220, 435 240, 465 265 C 440 230, 460 170, 400 125 C 380 105, 345 105, 315 110 Z" fill="#ffffff" />
  
  <!-- Main Sweeping Feather / Wing Body -->
  <path d="M 230 250 C 130 310, 45 270, 35 270 C 100 300, 160 380, 410 360 C 450 330, 400 240, 230 250 Z" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Lower Sweeping Tail Feather -->
  <path d="M 55 350 C 160 410, 340 435, 380 395" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
</svg>
