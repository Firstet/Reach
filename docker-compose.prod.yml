services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reach_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reach}
      POSTGRES_USER: ${POSTGRES_USER:-reach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reach_password}
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reach} -d ${POSTGRES_DB:-reach}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reach_redis_prod
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reach_backend_prod
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reach}:${POSTGRES_PASSWORD:-reach_password}@postgres:5432/${POSTGRES_DB:-reach}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-reach}:${POSTGRES_PASSWORD:-reach_password}@postgres:5432/${POSTGRES_DB:-reach}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - playwright_prod_data:/root/.cache/ms-playwright
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reach_worker_prod
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reach}:${POSTGRES_PASSWORD:-reach_password}@postgres:5432/${POSTGRES_DB:-reach}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-reach}:${POSTGRES_PASSWORD:-reach_password}@postgres:5432/${POSTGRES_DB:-reach}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - playwright_prod_data:/root/.cache/ms-playwright
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reach_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm start

volumes:
  postgres_prod_data:
  redis_prod_data:
  playwright_prod_data:
